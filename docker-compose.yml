version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: bhoomi_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhoomi_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./bhoomi_rakshak.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2-vl
    volumes:
      - ./backend/app:/app/app
      - ./backend/sample_data:/app/sample_data
      - sqlite_data:/app/db_storage
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhoomi_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  sqlite_data:
